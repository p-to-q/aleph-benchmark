name: Source parity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  offline-import-gate:
    name: Offline import gate (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out standalone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify installed import offline
        run: python -I -B scripts/check-source-v0.2-import.py
      - name: Verify E4a authority and portable Unicode archives offline
        run: |
          python -I -B scripts/check-v0-2-scoring-authority.py
          python -I -B scripts/check-portable-unicode-inputs.py
      - name: Verify E4b frozen string semantics without site packages
        run: |
          python -I -S -B scripts/generate-portable-string-semantics.py --check
          python -I -S -B bench/tests/test_portable_string_semantics.py
      - name: Run migration contract tests in isolated mode
        run: python -I -B -m unittest discover -s tests -p 'test_source_v0_2_import.py' -v
      - name: Run E4a authority and archive regression tests
        run: >-
          python -B -m unittest -v
          bench.tests.test_v0_2_scoring_authority_lock
          bench.tests.test_portable_unicode_inputs
      - name: Run metrics and protocol-document tests
        if: matrix.python != '3.14'
        run: python -B -m unittest -v tests.test_metrics_v0_2
      - name: Run v0.2 report tests
        if: matrix.python != '3.14'
        run: python -B -m unittest -v tests.test_report_v0_2
      - name: Run E3c cross-version package tests
        if: matrix.python != '3.14'
        run: >-
          python -B -m unittest -v
          bench.tests.test_protocol_v0_2 -k package
      - name: Run E3d cross-version verifier boundary tests
        if: matrix.python != '3.14'
        run: >-
          python -B -m unittest -v
          tests.test_verify_v0_2_port.VerifierInputBoundaryTests
      - name: Run E3e repository runner tests
        if: matrix.python != '3.14'
        run: python -B -m unittest -v tests.test_run_v0_2_port
      - name: Assert the canonical v0.2 scoring runtime
        if: matrix.python == '3.13'
        run: >-
          python -B -c
          'from bench.engine.scoring_core import validate_scoring_runtime;
          validate_scoring_runtime()'
      - name: Run the complete E3c protocol suite
        if: matrix.python == '3.13'
        run: python -B -m unittest -v bench.tests.test_protocol_v0_2
      - name: Run the complete E3d verifier suites
        if: matrix.python == '3.13'
        run: >-
          python -B -m unittest -v
          bench.tests.test_v0_2_verify
          tests.test_verify_v0_2_port.VerifierProtocolBoundaryTests
      - name: Verify frozen S2 data
        if: matrix.python == '3.13'
        run: python -I -B bench/data/generate_s2.py --check
      - name: Run currently independent copied tests
        if: matrix.python == '3.13'
        run: >-
          python -B -m unittest -v
          bench.tests.test_kaggle_capture
          bench.tests.test_kaggle_creation_output
          bench.tests.test_replay_adapter
          bench.tests.test_scorer_conformance

  macos-destination-safety:
    name: Destination safety (macOS 15 / Python ${{ matrix.python }})
    runs-on: macos-15
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - name: Check out standalone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify installed import offline
        run: python -I -B scripts/check-source-v0.2-import.py
      - name: Verify E4a authority and portable Unicode archives offline
        run: |
          python -I -B scripts/check-v0-2-scoring-authority.py
          python -I -B scripts/check-portable-unicode-inputs.py
      - name: Verify E4b frozen string semantics without site packages
        run: |
          python -I -S -B scripts/generate-portable-string-semantics.py --check
          python -I -S -B bench/tests/test_portable_string_semantics.py
      - name: Exercise Darwin package publication and safety gates
        run: >-
          python -B -m unittest -v
          bench.tests.test_protocol_v0_2 -k package
      - name: Exercise Darwin verifier input boundaries
        run: >-
          python -B -m unittest -v
          tests.test_verify_v0_2_port.VerifierInputBoundaryTests
      - name: Exercise Darwin repository runner boundaries
        run: python -B -m unittest -v tests.test_run_v0_2_port

  pinned-source-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out standalone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Fetch exact source objects
        shell: bash
        run: |
          set -euo pipefail
          source_git="${RUNNER_TEMP}/aleph-source"
          git init --quiet "${source_git}"
          git -C "${source_git}" remote add origin https://github.com/p-to-q/aleph.git
          # Depth four retains e265281 -> 5b47d89 -> a38114b -> 7a15c24 so
          # the reviewed-dependency ancestry proof does not rely on a shallow edge.
          git -C "${source_git}" fetch --no-tags --depth=4 origin \
            10abdc1368439d1ab454ee3862a59e14b67a9530 \
            d76206bdaf9ba72730b066560862a3d00cac9699 \
            8fb57eb921d792dbd245d849ab08ac5c7cf11c6e \
            7a15c2410e199b82dc65f9caf65f53aa9e8d6c5f \
            5b47d8946f21eef77c6620fdce3b0784d7a14694 \
            e265281321dc1013fff9cb288a72c15dcc5b749a
      - name: Verify pinned inventory and source tree
        run: >-
          python -I -B scripts/check-source-v0.2-import.py
          --source-git "${RUNNER_TEMP}/aleph-source"

  portable-authority-regeneration:
    name: Portable authority check (CPython 3.13.2 / UCD 15.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out standalone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up exact authority Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.2"
      - name: Regenerate and compare frozen semantics in memory
        run: |
          python -I -S -B scripts/generate-portable-string-semantics.py --check
          python -I -S -B bench/tests/test_portable_string_semantics.py \
            PortableStringSemanticsTests.test_checked_in_tables_exhaust_the_frozen_domain
